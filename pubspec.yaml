name: hangly
description: "A premium 3D hanging objects interactive desktop application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  shelf: ^1.4.3
  shelf_static: ^1.2.0
  webview_windows: ^0.4.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/web/libs/
    - assets/3d/
